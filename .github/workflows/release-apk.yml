# Builds a signed APK and attaches it to a GitHub release.
#
# Publishing a release with a tag like v0.2.0 sets versionName 0.2.0 and
# versionCode 2000 (major*1_000_000 + minor*1_000 + patch), so each release
# installs over the previous one. Running the workflow by hand builds an APK
# from the current branch and keeps it as a workflow artifact instead.
name: Release APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: app

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Test
        run: |
          npm run typecheck
          npm run lint
          npm test -- --ci

      - name: Set version from release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e '
            const fs = require("fs");
            const m = /^v?(\d+)\.(\d+)\.(\d+)$/.exec(process.env.TAG);
            if (!m) { console.error(`Tag "${process.env.TAG}" is not vX.Y.Z`); process.exit(1); }
            const [maj, min, pat] = m.slice(1).map(Number);
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.version = `${maj}.${min}.${pat}`;
            app.expo.android.versionCode = maj * 1000000 + min * 1000 + pat;
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
            console.log(`versionName ${app.expo.version}, versionCode ${app.expo.android.versionCode}`);
          '

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing, see docs/RELEASING.md"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Name APK
        id: apk
        env:
          REF_NAME: ${{ github.event.release.tag_name || github.sha }}
        run: |
          name="turkolinguo-${REF_NAME:0:12}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "path=app/$name" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "${{ steps.apk.outputs.name }}" --clobber

      - name: Keep as workflow artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14
