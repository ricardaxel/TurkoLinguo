# Checkpoint 1 — end of Unit 1 (L3–L9): meeting someone in a café.
id: C1
unit: U1
title: "Meeting someone in a café"
minutes: 6
intro:
  kind: summary
  title: "Checkpoint 1: in a café"
  body: |
    ☕ You meet someone at a café in Istanbul. Say hello, say who you are and where you're from, and order tea.

    This checkpoint mixes everything from **Unit 1**: *bu / şu / o*, plural **-lAr**, *I am* endings, **değil**, questions with **mI**, **var / yok**, adjectives and numbers.

    Score **70 %** to complete the unit. Wrong answers come back in your reviews.

items:
  - id: C1.check.01
    type: mini_dialogue
    grammar: [g.L5.copula, g.L7.question]
    turns:
      - { speaker: A, sentence: s.C1.001 }
      - { speaker: B, blank: true, answers: ["(Ben) iyiyim(, teşekkürler)."] }
  - id: C1.check.02
    type: mini_dialogue
    grammar: [g.L6.degil, g.L7.question]
    turns:
      - { speaker: A, sentence: s.L7.001 }
      - { speaker: B, blank: true, answers: ["Hayır, (ben) öğrenci değilim.", "Hayır, değilim."] }
  - id: C1.check.03
    type: qa
    grammar: [g.L5.copula]
    question: s.L5.011
    answers: ["(Ben) {İngilizim|Amerikalıyım|Kanadalıyım|Fransızım|Almanım|İtalyanım|İspanyolum|Japonum|Türküm}."]
    note: "Any nationality from T4 is accepted."
  - { id: C1.check.04, type: translate_to_tr, grammar: [g.L9.adj_num, g.L4.plural], sentence: s.L8.015, word_bank: [İki, çay, çaylar, lütfen, bir] }
  - { id: C1.check.05, type: translate_to_tr, grammar: [g.L8.varyok, g.L7.question], sentence: s.L8.001, typed: true }
  - { id: C1.check.06, type: pick_suffix, grammar: [g.L5.copula], pattern: g.L5.copula.1sg_vowel, base: w.öğrenci, suffix: sfx.cop_1sg, options: [yim, im, yım], answer: yim, feedback: { im: "**öğrenci** ends in a vowel, so the ending needs the buffer **y**: **öğrenciyim**.", yım: "The vowel follows the last vowel of **öğrenci** (i → **i**): **öğrenciyim**." } }
  - { id: C1.check.07, type: pick_suffix, grammar: [g.L4.plural], pattern: g.L4.plural.back, base: w.kitap, suffix: sfx.pl, options: [lar, ler], answer: lar, feedback: { ler: "The last vowel of **kitap** is **a** (back) → **-lar**: **kitaplar**." } }
  - { id: C1.check.08, type: type_form, grammar: [g.L5.copula], pattern: g.L5.copula.1pl, base: w.yorgun, suffixes: [sfx.cop_1pl], prompt: "we are tired", answer: yorgunuz, feedback: { yorgunyuz: "**yorgun** ends in a consonant: no buffer y: **yorgunuz**.", yorgunız: "The last vowel of **yorgun** is **u** → **-uz**: **yorgunuz**." } }
  - { id: C1.check.09, type: contrast_pair, grammar: [g.L6.degil], prompt: "I'm not hungry.", options: [s.L6.007, s.L6.014], answer: s.L6.007 }
  - id: C1.check.10
    type: spot_error
    grammar: [g.L4.plural, g.L9.adj_num]
    pattern: g.L4.plural.after_number
    text: "Bu iki kitaplar yeni."
    error: kitaplar
    answer: kitap
    sentence: s.L4.009
    feedback: { kitaplar: "After a number, the noun stays singular: **iki kitap**." }
  - { id: C1.check.11, type: translate_to_en, grammar: [g.L9.adj_num], sentence: s.L9.014 }
  - { id: C1.check.12, type: dictation, grammar: [g.L7.question], sentence: s.L7.004 }
  - { id: C1.check.13, type: translate_to_tr, grammar: [g.L9.adj_num], sentence: s.L9.004, word_bank: [Kırmızı, bir, araba, arabalar, kırmızı] }
  - { id: C1.check.14, type: translate_to_tr, grammar: [g.L8.varyok], sentence: s.L8.012, typed: true }

talk:
  id: C1.talk
  kind: free_chat
  minutes: 5
  title: "Meet someone"
  how:
    - "Greet your partner and ask how they are."
    - "Find out their nationality and job; tell them yours."
    - "Ask if they're married or a student, then say goodbye: Görüşürüz!"
  phrases: [s.C1.001, s.L7.010, s.L5.012, s.L5.022, s.L6.013, s.talk.C1.001]
  goals:
    - "I greeted and said goodbye"
    - "I said 3 things about myself"
    - "I asked 3 questions"
  partner:
    topic: "tanışma"
    knows: "selamlaşma; 'ben, sen' ile cümleler (öğretmenim, İngilizim); değil; evet/hayır soruları; var/yok; birden ona sayılar"
    questions: [s.L7.009, s.L5.011, s.L7.001, s.talk.C1.002]
