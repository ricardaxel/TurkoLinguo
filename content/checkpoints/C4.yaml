# Checkpoint 4 — end of Unit 4 (L19–L24): your family and your home.
id: C4
unit: U4
title: "Family and home"
minutes: 7
intro:
  kind: summary
  title: "Checkpoint 4: family and home"
  body: |
    👨‍👩‍👧 Talk about your family and your home: who you have, whose things these are, and where they are.

    This checkpoint mixes everything from **Unit 4**: *my / your / his* and *our / your / their*, the genitive **-(n)In**, compounds like *otobüs durağı*, *I have* with **var / yok**, and case endings after possessives (*evinde*).

    Score **70 %** to complete the unit. Wrong answers come back in your reviews.

items:
  - id: C4.check.01
    type: mini_dialogue
    grammar: [g.L23.have, g.L7.question]
    turns:
      - { speaker: A, sentence: s.L23.003 }
      - { speaker: B, blank: true, answers: ["(Benim) {bir|iki|üç|dört} kardeşim var.", "(Benim) kardeşim yok."] }
  - id: C4.check.02
    type: mini_dialogue
    grammar: [g.L23.have, g.L7.question]
    turns:
      - { speaker: A, sentence: s.L23.010 }
      - { speaker: B, blank: true, answers: ["Evet, (telefonum) var.", "Hayır, (telefonum) yok."] }
  - { id: C4.check.03, type: type_form, grammar: [g.L19.poss_sg], pattern: g.L19.poss_sg.soft, base: w.kitap, suffixes: [sfx.poss_1sg], prompt: "my book", answer: kitabım, feedback: { kitapım: "Before a vowel, final **p** softens to **b**: **kitabım**." } }
  - { id: C4.check.04, type: type_form, grammar: [g.L20.poss_pl], pattern: g.L20.poss_pl.vowel_1pl, base: w.araba, suffixes: [sfx.poss_1pl], prompt: "our car", answer: arabamız, feedback: { arabaımız: "After a vowel, *our* is just **-mIz**: **arabamız**." } }
  - { id: C4.check.05, type: pick_suffix, grammar: [g.L21.gen], pattern: g.L21.gen.cons, base: w.ev, suffix: sfx.gen, options: [in, nin, ın, un], answer: in, feedback: { nin: "**ev** ends in a consonant: no buffer n: **evin**.", ın: "The last vowel of **ev** is **e** → **-in**: **evin**.", un: "The last vowel of **ev** is **e** → **-in**: **evin**." } }
  - { id: C4.check.06, type: contrast_pair, grammar: [g.L22.compound], pattern: g.L22.compound.vs_gen, prompt: "This is the school's door.", options: [s.L22.009, s.L22.006], answer: s.L22.009 }
  - { id: C4.check.07, type: translate_to_tr, grammar: [g.L21.gen], pattern: g.L21.gen.name, sentence: s.L21.001, word_bank: ["Ali'nin", arabası, yeni, araba, Alinin] }
  - { id: C4.check.08, type: translate_to_tr, grammar: [g.L23.have, g.L21.gen], sentence: s.L23.007, typed: true }
  - id: C4.check.09
    type: spot_error
    grammar: [g.L24.poss_case]
    pattern: g.L24.poss_case.loc
    text: "Kedi Ali'nin evide."
    error: evide.
    answer: evinde.
    sentence: s.L24.001
    feedback: { evide: "After a 3rd-person possessive, the case ending takes **n**: ev·i·**n**·de → **evinde**." }
  - { id: C4.check.10, type: translate_to_en, grammar: [g.L24.poss_case], sentence: s.L24.003 }
  - { id: C4.check.11, type: dictation, grammar: [g.L20.poss_pl], sentence: s.L20.002 }
  - id: C4.check.12
    type: qa
    grammar: [g.L24.poss_case, g.L19.poss_sg]
    question: s.L24.021
    answers: ["{Başım|Ayağım|Kolum|Sırtım|Kulağım|Dişim|Karnım|Bacağım} ağrıyor."]
  - { id: C4.check.13, type: translate_to_tr, grammar: [g.L22.compound, g.L7.question], sentence: s.L22.002, typed: true }
  - { id: C4.check.14, type: translate_to_tr, grammar: [g.L23.have], sentence: s.L23.019, typed: true }

talk:
  id: C4.talk
  kind: free_chat
  minutes: 5
  title: "Show your family"
  how:
    - "Show photos of your family or home: Bu benim evim. Kardeşim öğrenci."
    - "Ask about your partner's family: Kardeşin var mı?"
    - "Ask whose things are around you: Bu kimin kitabı?"
  phrases: [s.L19.001, s.L23.004, s.L19.021, s.L23.018, s.L21.002]
  goals:
    - "I talked about my family"
    - "I asked about my partner's family"
    - "I asked whose something is"
  partner:
    topic: "aile ve eşyalar"
    knows: "benim, senin, bizim (evim, araban, evimiz); kimin? (Ali'nin kitabı); var/yok ile sahiplik (kardeşim var)"
    questions: [s.L19.006, s.L23.018, s.L23.003, s.L21.002]
