intro:
  kind: summary
  title: "Checkpoint 5: at the market"
  body: |
    🍅 Saturday morning at the bazaar: ask prices, compare, say what time you get up and how you travel.

    This checkpoint mixes everything from **Unit 5**: numbers and prices, telling the time, **-(y)lA** *with / by*, **-lI / -sIz** and origin (*İzmirli*), and comparing with **daha / en**.

    Score **70 %** to complete the unit. Wrong answers come back in your reviews.

