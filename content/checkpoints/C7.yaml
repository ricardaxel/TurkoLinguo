      - { speaker: B, blank: true, answers: ["(Ben) {yüzmek|uyumak|kitap okumak|film izlemek|dinlenmek} istiyorum."] }
  - { id: C7.check.03, type: type_form, grammar: [g.L33.future], pattern: g.L33.future.k_to_g, base: w.gelmek, suffixes: [sfx.fut, sfx.cop_1sg], prompt: "I will come", answer: geleceğim, feedback: { gelecekim: "Before a vowel, the last **k** softens to **ğ**: **geleceğim**." } }
