    type: mini_dialogue
    grammar: [g.L33.future, g.L17.dat]
    turns:
      - { speaker: A, sentence: s.C7.001 }
      - { speaker: B, blank: true, answers: ["(Ben) {Antalya'ya|İstanbul'a|İzmir'e|Ankara'ya|Londra'ya|Paris'e} gideceğim."] }
  - id: C7.check.02
