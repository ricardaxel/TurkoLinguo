# Checkpoint 7 — end of Unit 7 (L33–L35), the final A1 checkpoint: planning a trip.
id: C7
unit: U7
title: "Planning a trip"
minutes: 7
intro:
  kind: summary
  title: "Final checkpoint: planning a trip"
  body: |
    ✈️ You and a friend are planning a trip to Turkey: where you'll go, what you want to do, and what you need.

    This last checkpoint mixes **Unit 7**, the future **-(y)AcAK**, *want (to)* with **istemek**, *need (to)* with **lazım / gerek**, with the cases and tenses from the whole course.

    Score **70 %** to complete the A1 course. 🎉

items:
