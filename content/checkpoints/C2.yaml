# Checkpoint 2 — end of Unit 2 (L10–L13): where things are, where people are from.
id: C2
unit: U2
title: "Where is everything?"
minutes: 6
intro:
  kind: summary
  title: "Checkpoint 2: where?"
  body: |
    🏠 A friend calls while you're out. Say where you are and where you're from, then help find things around the house.

    This checkpoint mixes everything from **Unit 2**: **-DA** *in / at / on*, **-DA** + *I am* (*evdeyim*), names with an apostrophe, **-DAn** *from*, and the separate **de / da** *too*.

    Score **70 %** to complete the unit. Wrong answers come back in your reviews.

items:
  - id: C2.check.01
    type: mini_dialogue
    grammar: [g.L11.loc_copula, g.L7.question]
    turns:
      - { speaker: A, sentence: s.L11.001 }
      - { speaker: B, blank: true, answers: ["(Ben) {evdeyim|okuldayım|parktayım|marketteyim|bankadayım|sokaktayım}."] }
  - id: C2.check.02
    type: mini_dialogue
    grammar: [g.L12.abl, g.L7.question]
    turns:
      - { speaker: A, sentence: s.L12.001 }
      - { speaker: B, blank: true, answers: ["(Ben) {Londra'danım|İngiltere'denim|Paris'tenim|İstanbul'danım|Ankara'danım|İzmir'denim|Türkiye'denim}."] }
  - id: C2.check.03
    type: qa
    grammar: [g.L10.loc, g.L7.question]
    question: s.L10.001
    images: [img.own.room_scene]
    answers: ["(Kedi) kanepede."]
    feedback: "auto:g.L10.loc"
  - id: C2.check.04
    type: qa
    grammar: [g.L10.loc, g.L7.question]
    question: s.L10.003
    images: [img.own.room_scene]
    answers: ["(Kitap) masada."]
    feedback: "auto:g.L10.loc"
  - { id: C2.check.05, type: pick_suffix, grammar: [g.L10.loc], pattern: g.L10.loc.last_vowel, base: w.otobüs, suffix: sfx.loc, options: [da, de, ta, te], answer: te, feedback: "auto:g.L10.loc" }
  - { id: C2.check.06, type: pick_suffix, grammar: [g.L12.abl], pattern: g.L12.abl.voiceless, base: w.kitap, suffix: sfx.abl, options: [dan, den, tan, ten], answer: tan, feedback: "auto:g.L12.abl" }
  - { id: C2.check.07, type: type_form, grammar: [g.L11.loc_copula], pattern: g.L11.loc_copula.voiceless_1pl, base: w.park, suffixes: [sfx.loc, sfx.cop_1pl], prompt: "we are in the park", answer: parktayız, feedback: "auto:g.L11.loc_copula" }
  - { id: C2.check.08, type: translate_to_tr, grammar: [g.L13.clitic_de, g.L10.loc], sentence: s.L13.004, word_bank: [Ali, evde, ama, Ayşe, okulda, ve, evda] }
  - { id: C2.check.09, type: contrast_pair, grammar: [g.L13.clitic_de], pattern: g.L13.clitic_de.vs_loc, prompt: "Ayşe is at home too.", options: [s.L13.002, s.L13.003], answer: s.L13.002 }
  - id: C2.check.10
    type: spot_error
    grammar: [g.L11.loc_copula]
    pattern: g.L11.loc_copula.name
    text: "Ben İstanbuldayım."
    error: İstanbuldayım.
    answer: İstanbul'dayım.
    sentence: s.L11.021
    feedback: { "İstanbuldayım": "**İstanbul** is a name: put an apostrophe before the ending: **İstanbul'dayım**." }
  - { id: C2.check.11, type: translate_to_en, grammar: [g.L13.clitic_de, g.L12.abl], sentence: s.L13.014 }
  - { id: C2.check.12, type: dictation, grammar: [g.L11.loc_copula, g.L7.question], sentence: s.L11.014 }
  - { id: C2.check.13, type: translate_to_tr, grammar: [g.L12.abl], sentence: s.L12.011, typed: true }
  - id: C2.check.14
    type: qa
    grammar: [g.L11.loc_copula, g.L7.question]
    question: s.L11.004
    images: [img.own.person_at_home]
    answers: ["Hayır, (ben) evdeyim."]
    feedback: "auto:g.L11.loc_copula"
