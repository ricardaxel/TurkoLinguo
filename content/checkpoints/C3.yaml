# Checkpoint 3 — end of Unit 3 (L14–L18): a day in your life.
id: C3
unit: U3
title: "A day in your life"
minutes: 7
intro:
  kind: summary
  title: "Checkpoint 3: your day"
  body: |
    🌅 Talk about what you're doing today: where you're going, what you're eating, who you're waiting for.

    This checkpoint mixes everything from **Unit 3**: commands, the present **-(I)yor** with its negative and questions, **-(y)A** *to* (with softening), and **-(y)I** for a specific object.

    Score **70 %** to complete the unit. Wrong answers come back in your reviews.

items:
  - id: C3.check.01
    type: mini_dialogue
    grammar: [g.L15.prog, g.L7.question]
    turns:
      - { speaker: A, sentence: s.L15.001 }
      - { speaker: B, blank: true, answers: ["(Ben) {kitap okuyorum|çay içiyorum|kahve içiyorum|kahvaltı yapıyorum|çalışıyorum|bekliyorum}."] }
  - id: C3.check.02
    type: mini_dialogue
    grammar: [g.L17.dat, g.L15.prog]
    turns:
