      - { speaker: B, blank: true, answers: ["(Ben) {okula|eve|markete|parka|bankaya|hastaneye|İzmir'e|İstanbul'a|Ankara'ya} gidiyorum."] }
  - { id: C3.check.03, type: type_form, grammar: [g.L15.prog], base: w.gelmek, suffixes: [sfx.prog, sfx.cop_1sg], prompt: "I'm coming", answer: geliyorum, feedback: { gelyorum: "After a consonant, -(I)yor needs its vowel: gel·**i**·yor·um → **geliyorum**.", geliyorım: "-yor never changes, so the ending is always **-um**: **geliyorum**." } }
  - { id: C3.check.04, type: type_form, grammar: [g.L16.prog_neg_q], base: w.okumak, suffixes: [sfx.neg, sfx.prog, sfx.cop_1sg], prompt: "I'm not reading", answer: okumuyorum, feedback: { okumayorum: "Before -yor, the negative **-mA** becomes **-mI**, following the stem: oku → **mu**: **okumuyorum**.", okumıyorum: "The negative vowel follows the last vowel of **oku**: **u** → **mu**: **okumuyorum**." } }
  - { id: C3.check.05, type: pick_suffix, grammar: [g.L17.dat], pattern: g.L17.dat.back, base: w.okul, suffix: sfx.dat, options: [a, e, ya, ye], answer: a, feedback: "auto:g.L17.dat" }
