# Frame sentences for theme T20 (Weather & seasons, core).
# Pack 1 unlocks after L31 (grammar up to the past -DI); pack 2 after L33.
# "Yağmur yağıyor" = "it's raining": rain + the verb yağmak "to fall (rain, snow)".

- id: s.T20.001
  tr: Dün kar yağdı.
  en: ["It snowed yesterday.", "Yesterday it snowed."]
  words: [w.dün, w.kar, w.yağmak]
  grammar: [g.L30.past]
  source: { kind: original }
  audio: aud.own.s.T20.001

- id: s.T20.002
  tr: Bugün yağmur yağıyor.
  en: ["It's raining today.", "It is raining today.", "Today it's raining."]
  words: [w.bugün, w.yağmur, w.yağmak]
  grammar: [g.L15.prog]
  source: { kind: original }
  audio: aud.own.s.T20.002

- id: s.T20.003
  tr: Hava güneşli.
  en: ["It's sunny.", "The weather is sunny.", "It is sunny."]
