# Frame sentences for theme T14 (Family). Only grammar up to L18, and no possessives (L19).
# Frames use words that sound natural bare (çocuk, kız, dede): with anne, baba, teyze a native would say annem, babam, teyzem (L19).

- id: s.T14.001
  tr: Çocuk okulda.
  en: ["The child is at school.", "The kid is at school."]
  words: [w.çocuk, w.okul]
  grammar: [g.L3.basics, g.L10.loc]
  source: { kind: original }
  audio: aud.own.s.T14.001

- id: s.T14.002
  tr: Çocuklar parkta oynuyor.
  en: ["The children are playing in the park.", "The kids are playing in the park."]
  words: [w.çocuk, w.park, w.oynamak]
  grammar: [g.L4.plural, g.L10.loc, g.L15.prog]
  source: { kind: original }
  audio: aud.own.s.T14.002

- id: s.T14.003
  tr: Dede çay içiyor.
  en: ["Grandpa is drinking tea.", "Grandfather is drinking tea.", "The grandfather is drinking tea."]
  words: [w.dede, w.çay, w.içmek]
  grammar: [g.L15.prog]
  source: { kind: original }
  audio: aud.own.s.T14.003

- id: s.T14.004
  tr: Kız kitap okuyor.
  en: ["The girl is reading a book.", "The girl is reading.", "The girl reads books."]
  words: [w.kız, w.kitap, w.okumak]
  grammar: [g.L15.prog]
  source: { kind: original }
  audio: aud.own.s.T14.004
