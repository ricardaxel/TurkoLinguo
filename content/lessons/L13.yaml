      - { id: L13.practise.06, type: translate_to_tr, grammar: [g.L13.clitic_de, g.L10.loc], sentence: s.L13.004, word_bank: [Ali, evde, ama, ve, Ayşe, okulda, de] }
      - { id: L13.practise.07, type: translate_to_tr, grammar: [g.L13.clitic_de, g.L10.loc], sentence: s.L13.011, word_bank: [Köpek, ve, kedi, bahçede, de, ama] }
      - { id: L13.practise.08, type: translate_to_en, grammar: [g.L13.clitic_de, g.L12.abl, g.L5.copula], sentence: s.L13.009 }
      - id: L13.practise.09
