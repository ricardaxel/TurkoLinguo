      - { id: L13.practise.13, type: translate_to_tr, grammar: [g.L13.clitic_de, g.L12.abl, g.L5.copula], sentence: s.L13.014, word_bank: [Ben, Londra'danım, ama, ve, Ayşe, İstanbul'dan, İstanbul'da] }
      - id: L13.practise.14
