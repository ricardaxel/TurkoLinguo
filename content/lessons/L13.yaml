      - { id: L13.practise.10, type: translate_to_tr, grammar: [g.L13.clitic_de, g.L11.loc_copula, g.L7.question], sentence: s.L13.010, typed: true }
      - { id: L13.practise.11, type: dictation, grammar: [g.L13.clitic_de, g.L10.loc], sentence: s.L13.012 }
      - id: L13.practise.12
