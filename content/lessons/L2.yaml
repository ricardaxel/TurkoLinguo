        type: picture_choose
        grammar: [g.L2.harmony]
        pattern: g.L2.harmony.two_way
        images: [img.openmoji.cat]
        prompt: "**kedi** + A → A = …"
        options: [a, e]
        answer: e
        translation: "kedi = cat. Last vowel i (front) → A = e."
      - id: L2.practise.02
        type: picture_choose
        grammar: [g.L2.harmony]
        pattern: g.L2.harmony.last_vowel
        images: [img.openmoji.bus]
        prompt: "**otobüs** + A → A = …"
        options: [a, e]
        answer: e
        translation: "otobüs = bus. The first vowel is o, but the last one is ü (front) → A = e."
      - id: L2.practise.03
        type: picture_choose
        grammar: [g.L2.harmony]
        pattern: g.L2.harmony.four_way
        images: [img.openmoji.girl]
        prompt: "**kız** + I → I = …"
        options: [ı, i, u, ü]
        answer: ı
        translation: "kız = girl. ı is back and spread → I = ı."
      - id: L2.practise.04
        type: picture_choose
        grammar: [g.L2.harmony]
        pattern: g.L2.harmony.four_way
        images: [img.openmoji.cat]
        prompt: "**kedi** + I → I = …"
        options: [ı, i, u, ü]
        answer: i
        translation: "kedi = cat. Last vowel i (front, spread) → I = i."
