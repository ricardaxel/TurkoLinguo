      - { id: L2.practise.13, type: dictation, grammar: [g.L2.harmony, g.L1.alphabet], sentence: s.L2.001 }
      - { id: L2.practise.14, type: dictation, grammar: [g.L2.harmony, g.L1.alphabet], sentence: s.L2.005, note: "o·to·büs: two dots on the last vowel only." }
