        type: picture_choose
        grammar: [g.L2.harmony]
        pattern: g.L2.harmony.four_way
        images: [img.openmoji.calendar]
        prompt: "**gün** + I → I = …"
        options: [ı, i, u, ü]
        answer: ü
        translation: "gün = day. ü is front and rounded → I = ü."
      - id: L2.practise.06
        type: picture_choose
        grammar: [g.L2.harmony]
        pattern: g.L2.harmony.four_way
        images: [img.openmoji.droplet]
        prompt: "**su** + I → I = …"
        options: [ı, i, u, ü]
        answer: u
        translation: "su = water. u is back and rounded → I = u."
      - id: L2.practise.07
        type: picture_choose
        grammar: [g.L2.harmony]
        pattern: g.L2.harmony.last_vowel
        images: [img.openmoji.phone]
        prompt: "**te·le·fon**: which vowel decides the ending?"
        options: [e, o]
        answer: o
        translation: "telefon = phone. Only the last vowel counts: o → back family."
      - id: L2.practise.08
        type: picture_choose
        grammar: [g.L2.harmony]
        pattern: g.L2.harmony.two_way
        images: [img.own.table]
        prompt: "**masa**: which family is its last vowel?"
        options: ["front (e i ö ü)", "back (a ı o u)"]
        answer: "back (a ı o u)"
        translation: "masa = table. a is a back vowel."
      - id: L2.practise.09
        type: picture_choose
        grammar: [g.L2.harmony]
        pattern: g.L2.harmony.four_way
        images: [img.openmoji.house]
        prompt: "**ev** + I → I = …"
        options: [ı, i, u, ü]
        answer: i
        translation: "ev = house. e is front and spread → I = i."
      - id: L2.practise.10
        type: picture_choose
        grammar: [g.L2.harmony]
        pattern: g.L2.harmony.four_way
        images: [img.openmoji.car]
        prompt: "**araba** + I → I = …"
        options: [ı, i, u, ü]
        answer: ı
        translation: "araba = car. a is back and spread → I = ı."
      - id: L2.practise.11
