# Expected forms: shared test cases for the app's form engine (and future validator checks).

# Locative -DA (L10)
- { word: w.masa,    suffixes: [sfx.loc], expected: masada,    note: "back vowel, after vowel" }
- { word: w.ev,      suffixes: [sfx.loc], expected: evde,      note: "front vowel" }
- { word: w.okul,    suffixes: [sfx.loc], expected: okulda }
- { word: w.kitap,   suffixes: [sfx.loc], expected: kitapta,   note: "voiceless p, no softening before a consonant" }
- { word: w.mutfak,  suffixes: [sfx.loc], expected: mutfakta }
- { word: w.süt,     suffixes: [sfx.loc], expected: sütte }
- { word: w.otobüs,  suffixes: [sfx.loc], expected: otobüste,  note: "only the last vowel counts" }
- { word: w.kanepe,  suffixes: [sfx.loc], expected: kanepede }
- { word: w.ev,      suffixes: [sfx.pl, sfx.loc], expected: evlerde }
- { word: w.saat,    suffixes: [sfx.loc], expected: saatte,    note: "front flag" }
- { word: w.yatak_odası, suffixes: [sfx.loc], expected: yatak odasında, note: "compound: buffer n" }

# Vowel-initial endings (L17, L18): softening, vowel drop, irregulars
- { word: w.kitap,   suffixes: [sfx.dat], expected: kitaba }
- { word: w.kitap,   suffixes: [sfx.acc], expected: kitabı }
- { word: w.mutfak,  suffixes: [sfx.dat], expected: mutfağa }
- { word: w.masa,    suffixes: [sfx.dat], expected: masaya,    note: "buffer y" }
- { word: w.oğul,    suffixes: [sfx.acc], expected: oğlu,      note: "vowel drop" }
- { word: w.su,      suffixes: [sfx.acc], expected: suyu,      note: "irregular" }
- { word: w.su,      suffixes: [sfx.gen], expected: suyun,     note: "irregular" }
- { word: w.saat,    suffixes: [sfx.acc], expected: saati,     note: "front flag" }
- { word: w.buzdolabı, suffixes: [sfx.acc], expected: buzdolabını, note: "compound" }
- { word: w.buzdolabı, suffixes: [sfx.pl], expected: buzdolapları, note: "compound: possessive moves after the plural" }

# Location + "to be" (L11): -DA always ends in a vowel → buffer y
- { word: w.ev,      suffixes: [sfx.loc, sfx.cop_1sg], expected: evdeyim }
- { word: w.okul,    suffixes: [sfx.loc, sfx.cop_2sg], expected: okuldasın }
- { word: w.park,    suffixes: [sfx.loc, sfx.cop_1pl], expected: parktayız, note: "voiceless k → t, then buffer y" }
- { word: w.hastane, suffixes: [sfx.loc, sfx.cop_2pl], expected: hastanedesiniz }
- { word: w.bahçe,   suffixes: [sfx.loc, sfx.cop_3pl], expected: bahçedeler }
- { word: w.market,  suffixes: [sfx.loc, sfx.cop_1sg], expected: marketteyim }
- { word: w.sokak,   suffixes: [sfx.loc, sfx.cop_1sg], expected: sokaktayım, note: "soft flag ignored: -DA is consonant-initial" }
- { word: w.şehir,   suffixes: [sfx.loc], expected: şehirde,   note: "drop flag ignored before a consonant" }
- { word: w.havalimanı, suffixes: [sfx.loc, sfx.cop_1sg], expected: havalimanındayım, note: "compound: buffer n" }

# Proper nouns: apostrophe before the ending (L11, L12)
- { word: w.İstanbul, suffixes: [sfx.loc], expected: "İstanbul'da" }
- { word: w.Ali,      suffixes: [sfx.loc], expected: "Ali'de" }
- { word: w.Ahmet,    suffixes: [sfx.loc], expected: "Ahmet'te" }
- { word: w.Ankara,   suffixes: [sfx.loc, sfx.cop_1sg], expected: "Ankara'dayım" }
- { word: w.İzmir,    suffixes: [sfx.loc, sfx.cop_1sg], expected: "İzmir'deyim" }

# Ablative -DAn (L12): same choices as -DA; after it no buffer y
- { word: w.ev,      suffixes: [sfx.abl], expected: evden }
- { word: w.okul,    suffixes: [sfx.abl], expected: okuldan }
- { word: w.kitap,   suffixes: [sfx.abl], expected: kitaptan,  note: "no softening before a consonant" }
- { word: w.otobüs,  suffixes: [sfx.abl], expected: otobüsten, note: "only the last vowel counts" }
- { word: w.banka,   suffixes: [sfx.abl], expected: bankadan }
- { word: w.kütüphane, suffixes: [sfx.abl], expected: kütüphaneden }
- { word: w.ev,      suffixes: [sfx.pl, sfx.abl], expected: evlerden }
- { word: w.saat,    suffixes: [sfx.abl], expected: saatten,   note: "front flag" }
- { word: w.yatak_odası, suffixes: [sfx.abl], expected: yatak odasından, note: "compound: buffer n" }
- { word: w.İstanbul, suffixes: [sfx.abl], expected: "İstanbul'dan" }
- { word: w.Türkiye,  suffixes: [sfx.abl, sfx.cop_1sg], expected: "Türkiye'denim" }
- { word: w.Londra,   suffixes: [sfx.abl, sfx.cop_1sg], expected: "Londra'danım" }
- { word: w.İzmir,    suffixes: [sfx.abl, sfx.cop_1pl], expected: "İzmir'deniz" }
- { word: w.Ahmet,    suffixes: [sfx.abl], expected: "Ahmet'ten" }

# T9 places + locative (Turkish-expert checklist)
- { word: w.market,  suffixes: [sfx.loc], expected: markette }
- { word: w.park,    suffixes: [sfx.loc], expected: parkta }
- { word: w.sokak,   suffixes: [sfx.loc], expected: sokakta,   note: "no softening before a consonant" }
- { word: w.havalimanı, suffixes: [sfx.loc], expected: havalimanında, note: "compound: buffer n" }
- { word: w.cami,    suffixes: [sfx.loc], expected: camide }
- { word: w.eczane,  suffixes: [sfx.loc], expected: eczanede }
- { word: w.köprü,   suffixes: [sfx.loc], expected: köprüde }
- { word: w.ben,     suffixes: [sfx.loc], expected: bende,     note: "vs the clitic: ben de 'me too'" }
- { word: w.Paris,   suffixes: [sfx.loc], expected: "Paris'te" }
- { word: w.Paris,   suffixes: [sfx.abl], expected: "Paris'ten" }

# --- L30–L35 ---
# Past of "to be" -(y)DI + the short person endings (L32): buffer y after a vowel, D rule after a consonant
- { word: w.ev,       suffixes: [sfx.loc, sfx.cop_past, sfx.kpers_1sg], expected: evdeydim }
- { word: w.ev,       suffixes: [sfx.loc, sfx.cop_past, sfx.kpers_2pl], expected: evdeydiniz }
- { word: w.ev,       suffixes: [sfx.loc, sfx.cop_past, sfx.kpers_3pl], expected: evdeydiler }
- { word: w.park,     suffixes: [sfx.loc, sfx.cop_past, sfx.kpers_1sg], expected: parktaydım, note: "voiceless k → -ta, then buffer y" }
- { word: w.park,     suffixes: [sfx.loc, sfx.cop_past, sfx.kpers_1pl], expected: parktaydık }
- { word: w.Ankara,   suffixes: [sfx.loc, sfx.cop_past, sfx.kpers_1sg], expected: "Ankara'daydım" }
- { word: w.hasta,    suffixes: [sfx.cop_past, sfx.kpers_1sg], expected: hastaydım }
- { word: w.hasta,    suffixes: [sfx.cop_past, sfx.kpers_2sg], expected: hastaydın }
- { word: w.öğrenci,  suffixes: [sfx.cop_past, sfx.kpers_1sg], expected: öğrenciydim }
- { word: w.öğretmen, suffixes: [sfx.cop_past, sfx.kpers_1sg], expected: öğretmendim, note: "after a consonant: no y" }
- { word: w.yorgun,   suffixes: [sfx.cop_past, sfx.kpers_1pl], expected: yorgunduk }
- { word: w.Türk,     suffixes: [sfx.cop_past, sfx.kpers_1sg], expected: Türktüm,  note: "voiceless k → t; nationality, no apostrophe" }
- { word: w.büyük,    suffixes: [sfx.cop_past], expected: büyüktü }
- { word: w.var,      suffixes: [sfx.cop_past], expected: vardı }
- { word: w.yok,      suffixes: [sfx.cop_past], expected: yoktu }
- { word: w.değil,    suffixes: [sfx.cop_past, sfx.kpers_1sg], expected: değildim }
- { word: w.güneşli,  suffixes: [sfx.cop_past], expected: güneşliydi }
- { word: w.soğuk,    suffixes: [sfx.cop_past], expected: soğuktu,  note: "no softening before a consonant" }

