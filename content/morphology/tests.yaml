# Verbs (L14–L16): the engine doesn't inflect verbs yet (it keeps -mAk: gelmek + -(I)yor → gelmekiyor).
# It needs: strip -mAk from the lemma; t → d (gitmek, etmek only); ye/de → yi/di before -yor, yiy/dey before -In;
# stem-final a/e → ı/i/u/ü before -yor; -mA → -mI before -yor; mI as a separate word after -yor.
# Polite / plural command -(y)In (L14)
- { word: w.gelmek,   suffixes: [sfx.imp_pol], expected: gelin,   pending: "verbs: strip -mAk" }
- { word: w.oturmak,  suffixes: [sfx.imp_pol], expected: oturun,  pending: "verbs: strip -mAk" }
- { word: w.bakmak,   suffixes: [sfx.imp_pol], expected: bakın,   pending: "verbs: strip -mAk; no k → ğ in verbs" }
- { word: w.görmek,   suffixes: [sfx.imp_pol], expected: görün,   pending: "verbs: strip -mAk" }
- { word: w.okumak,   suffixes: [sfx.imp_pol], expected: okuyun,  pending: "verbs: strip -mAk; buffer y" }
- { word: w.beklemek, suffixes: [sfx.imp_pol], expected: bekleyin, pending: "verbs: strip -mAk; buffer y" }
- { word: w.yapmak,   suffixes: [sfx.imp_pol], expected: yapın,   pending: "verbs: strip -mAk; no p → b" }
- { word: w.içmek,    suffixes: [sfx.imp_pol], expected: için,    pending: "verbs: strip -mAk; no ç → c" }
- { word: w.gitmek,   suffixes: [sfx.imp_pol], expected: gidin,   pending: "verbs: t → d before a vowel (gitmek, etmek only)" }
- { word: w.etmek,    suffixes: [sfx.imp_pol], expected: edin,    pending: "verbs: t → d before a vowel (gitmek, etmek only)" }
- { word: w.yemek,    suffixes: [sfx.imp_pol], expected: yiyin,   pending: "verbs: ye → yiy before -In" }
- { word: w.demek,    suffixes: [sfx.imp_pol], expected: deyin,   pending: "verbs: de → dey before -In" }

