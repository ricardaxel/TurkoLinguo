- { word: w.yaş,     suffixes: [sfx.poss_3sg, sfx.loc], expected: yaşında, note: "Kaç yaşındasın? fixed pattern" }
- { word: w.tane,    suffixes: [sfx.poss_3sg], expected: tanesi }
- { word: w.kilo,    suffixes: [sfx.poss_3sg], expected: kilosu }

