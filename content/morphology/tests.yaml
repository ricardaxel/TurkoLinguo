# -(y)lA "with, by" (L27): 2-way harmony, buffer y, no softening, no buffer n after a possessive
- { word: w.otobüs,  suffixes: [sfx.ins], expected: otobüsle, note: "only the last vowel counts" }
- { word: w.tren,    suffixes: [sfx.ins], expected: trenle }
- { word: w.araba,   suffixes: [sfx.ins], expected: arabayla, note: "buffer y" }
- { word: w.taksi,   suffixes: [sfx.ins], expected: taksiyle }
- { word: w.metro,   suffixes: [sfx.ins], expected: metroyla }
- { word: w.uçak,    suffixes: [sfx.ins], expected: uçakla,   note: "no softening: consonant-initial after a consonant" }
- { word: w.kalem,   suffixes: [sfx.ins], expected: kalemle }
- { word: w.saat,    suffixes: [sfx.ins], expected: saatle,   note: "front flag" }
- { word: w.onlar,   suffixes: [sfx.ins], expected: onlarla }
- { word: w.Ali,     suffixes: [sfx.ins], expected: "Ali'yle" }
- { word: w.Ayşe,    suffixes: [sfx.ins], expected: "Ayşe'yle" }
- { word: w.Ahmet,   suffixes: [sfx.ins], expected: "Ahmet'le" }
- { word: w.arkadaş, suffixes: [sfx.poss_1sg, sfx.ins], expected: arkadaşımla }
- { word: w.anne,    suffixes: [sfx.poss_1sg, sfx.ins], expected: annemle }
- { word: w.kardeş,  suffixes: [sfx.poss_3sg, sfx.ins], expected: kardeşiyle, note: "no buffer n before -(y)lA" }
- { word: w.ben,     suffixes: [sfx.ins], expected: benimle,  pending: "pronouns take -lA on the genitive form (benim·le); engine gives benle" }
- { word: w.sen,     suffixes: [sfx.ins], expected: seninle,  pending: "pronouns take -lA on the genitive form (senin·le)" }
- { word: w.o,       suffixes: [sfx.ins], expected: onunla,   pending: "pronouns take -lA on the genitive form (onun·la); engine gives oyla" }
- { word: w.biz,     suffixes: [sfx.ins], expected: bizimle,  pending: "pronouns take -lA on the genitive form (bizim·le)" }
- { word: w.siz,     suffixes: [sfx.ins], expected: sizinle,  pending: "pronouns take -lA on the genitive form (sizin·le)" }
- { word: w.kim,     suffixes: [sfx.ins], expected: kiminle,  pending: "kim takes -lA on the genitive form (kimin·le); engine gives kimle (colloquial)" }

