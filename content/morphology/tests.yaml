- { word: w.şeker,   suffixes: [sfx.siz], expected: şekersiz }
- { word: w.tuz,     suffixes: [sfx.li],  expected: tuzlu }
- { word: w.tuz,     suffixes: [sfx.siz], expected: tuzsuz }
