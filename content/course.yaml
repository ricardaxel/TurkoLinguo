# Course structure: the single source of truth for lesson order (see CURRICULUM.md).
# A lesson without `file` is planned but not written yet.

units:
  - { id: U0, title: Sounds, lessons: [L1, L2] }
  - { id: U1, title: Who & what, lessons: [L3, L4, L5, L6, L7, L8, L9], checkpoint: C1 }
  - { id: U2, title: Where, lessons: [L10, L11, L12, L13], checkpoint: C2 }
  - { id: U3, title: Actions, lessons: [L14, L15, L16, L17, L18], checkpoint: C3 }
  - { id: U4, title: Mine & yours, lessons: [L19, L20, L21, L22, L23, L24], checkpoint: C4 }
  - { id: U5, title: Daily life, lessons: [L25, L26, L27, L28, L29], checkpoint: C5 }
  - { id: U6, title: Yesterday, lessons: [L30, L31, L32], checkpoint: C6 }
  - { id: U7, title: Plans & wishes, lessons: [L33, L34, L35], checkpoint: C7 }

