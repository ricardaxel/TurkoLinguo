- { id: aud.own.s.L4.004, kind: audio, source: own, license: OWN, status: planned, text: "Bu kitaplar yeni." }
- { id: aud.own.s.L4.005, kind: audio, source: own, license: OWN, status: planned, text: "İki kedi." }
- { id: aud.own.s.L4.006, kind: audio, source: own, license: OWN, status: planned, text: "Çok kitap." }
- { id: aud.own.s.L4.007, kind: audio, source: own, license: OWN, status: planned, text: "Çok kedi." }
- { id: aud.own.s.L4.008, kind: audio, source: own, license: OWN, status: planned, text: "Saatler eski." }
- { id: aud.own.s.L4.009, kind: audio, source: own, license: OWN, status: planned, text: "Bu iki kitap yeni." }
- { id: aud.own.s.L4.010, kind: audio, source: own, license: OWN, status: planned, text: "Arabalar yeni." }
- { id: aud.own.s.L4.011, kind: audio, source: own, license: OWN, status: planned, text: "Telefonlar eski." }
- { id: aud.own.s.L4.012, kind: audio, source: own, license: OWN, status: planned, text: "Bu kalemler yeni." }
- { id: aud.own.s.L5.001, kind: audio, source: own, license: OWN, status: planned, text: "Ben öğretmenim." }
- { id: aud.own.s.L5.002, kind: audio, source: own, license: OWN, status: planned, text: "Sen öğrencisin." }
- { id: aud.own.s.L5.003, kind: audio, source: own, license: OWN, status: planned, text: "O doktor." }
- { id: aud.own.s.L5.004, kind: audio, source: own, license: OWN, status: planned, text: "Biz Türküz." }
- { id: aud.own.s.L5.005, kind: audio, source: own, license: OWN, status: planned, text: "Siz İngilizsiniz." }
- { id: aud.own.s.L5.006, kind: audio, source: own, license: OWN, status: planned, text: "Onlar öğrenci." }
- { id: aud.own.s.L5.007, kind: audio, source: own, license: OWN, status: planned, text: "Ben hastayım." }
- { id: aud.own.s.L5.008, kind: audio, source: own, license: OWN, status: planned, text: "Ben yorgunum." }
- { id: aud.own.s.L5.009, kind: audio, source: own, license: OWN, status: planned, text: "Sen mutlusun." }
- { id: aud.own.s.L5.010, kind: audio, source: own, license: OWN, status: planned, text: "İyiyim." }
- { id: aud.own.s.L5.011, kind: audio, source: own, license: OWN, status: planned, text: "Nerelisin?" }
- { id: aud.own.s.L5.012, kind: audio, source: own, license: OWN, status: planned, text: "İngilizim." }
- { id: aud.own.s.L5.013, kind: audio, source: own, license: OWN, status: planned, text: "Amerikalıyım." }
- { id: aud.own.s.L5.014, kind: audio, source: own, license: OWN, status: planned, text: "Ben Türküm." }
- { id: aud.own.s.L5.015, kind: audio, source: own, license: OWN, status: planned, text: "Biz öğrenciyiz." }
- { id: aud.own.s.L5.016, kind: audio, source: own, license: OWN, status: planned, text: "Siz doktorsunuz." }
- { id: aud.own.s.L5.017, kind: audio, source: own, license: OWN, status: planned, text: "Ali hasta." }
- { id: aud.own.s.L5.018, kind: audio, source: own, license: OWN, status: planned, text: "Ayşe öğretmen." }
- { id: aud.own.s.L5.019, kind: audio, source: own, license: OWN, status: planned, text: "Biz yorgunuz." }
- { id: aud.own.s.L5.020, kind: audio, source: own, license: OWN, status: planned, text: "Onlar mutlu." }
- { id: aud.own.s.L5.021, kind: audio, source: own, license: OWN, status: planned, text: "Nerelisiniz?" }
- { id: aud.own.s.L5.022, kind: audio, source: own, license: OWN, status: planned, text: "Ben öğrenciyim." }
- { id: aud.own.s.L6.001, kind: audio, source: own, license: OWN, status: planned, text: "Ben öğretmen değilim." }
- { id: aud.own.s.L6.002, kind: audio, source: own, license: OWN, status: planned, text: "Sen hasta değilsin." }
- { id: aud.own.s.L6.003, kind: audio, source: own, license: OWN, status: planned, text: "O doktor değil." }
- { id: aud.own.s.L6.004, kind: audio, source: own, license: OWN, status: planned, text: "Biz yorgun değiliz." }
- { id: aud.own.s.L6.005, kind: audio, source: own, license: OWN, status: planned, text: "Siz Türk değilsiniz." }
- { id: aud.own.s.L6.006, kind: audio, source: own, license: OWN, status: planned, text: "Onlar öğrenci değil." }
- { id: aud.own.s.L6.007, kind: audio, source: own, license: OWN, status: planned, text: "Ben aç değilim." }
- { id: aud.own.s.L6.008, kind: audio, source: own, license: OWN, status: planned, text: "Ayşe evli değil." }
- { id: aud.own.s.L6.009, kind: audio, source: own, license: OWN, status: planned, text: "Ben İngiliz değilim, Amerikalıyım." }
- { id: aud.own.s.L6.010, kind: audio, source: own, license: OWN, status: planned, text: "Bu bir kitap değil." }
- { id: aud.own.s.L6.011, kind: audio, source: own, license: OWN, status: planned, text: "Ayşe hasta değil, yorgun." }
- { id: aud.own.s.L6.012, kind: audio, source: own, license: OWN, status: planned, text: "Biz aç değiliz." }
- { id: aud.own.s.L6.013, kind: audio, source: own, license: OWN, status: planned, text: "Ben evli değilim." }
- { id: aud.own.s.L6.014, kind: audio, source: own, license: OWN, status: planned, text: "Ben açım." }
- { id: aud.own.s.L6.015, kind: audio, source: own, license: OWN, status: planned, text: "Ben hasta değilim." }
- { id: aud.own.s.L6.016, kind: audio, source: own, license: OWN, status: planned, text: "Ayşe evli." }
- { id: aud.own.s.L6.017, kind: audio, source: own, license: OWN, status: planned, text: "Ben yorgun değilim." }
- { id: aud.own.s.L6.018, kind: audio, source: own, license: OWN, status: planned, text: "Sen Amerikalısın." }
- { id: aud.own.s.L7.001, kind: audio, source: own, license: OWN, status: planned, text: "Öğrenci misin?" }
- { id: aud.own.s.L7.002, kind: audio, source: own, license: OWN, status: planned, text: "Evet, öğrenciyim." }
- { id: aud.own.s.L7.003, kind: audio, source: own, license: OWN, status: planned, text: "Hasta mı?" }
- { id: aud.own.s.L7.004, kind: audio, source: own, license: OWN, status: planned, text: "Ayşe öğretmen mi?" }
- { id: aud.own.s.L7.005, kind: audio, source: own, license: OWN, status: planned, text: "Yorgun musun?" }
- { id: aud.own.s.L7.006, kind: audio, source: own, license: OWN, status: planned, text: "Türk müsün?" }
- { id: aud.own.s.L7.007, kind: audio, source: own, license: OWN, status: planned, text: "Siz doktor musunuz?" }
- { id: aud.own.s.L7.008, kind: audio, source: own, license: OWN, status: planned, text: "Öğrenciler mi?" }
- { id: aud.own.s.L7.009, kind: audio, source: own, license: OWN, status: planned, text: "Nasılsın?" }
- { id: aud.own.s.L7.010, kind: audio, source: own, license: OWN, status: planned, text: "İyiyim, teşekkürler." }
- { id: aud.own.s.L7.011, kind: audio, source: own, license: OWN, status: planned, text: "O kim?" }
- { id: aud.own.s.L7.012, kind: audio, source: own, license: OWN, status: planned, text: "Ali nerede?" }
- { id: aud.own.s.L7.013, kind: audio, source: own, license: OWN, status: planned, text: "Bu kitap mı?" }
- { id: aud.own.s.L7.014, kind: audio, source: own, license: OWN, status: planned, text: "Hayır, bu bir defter." }
- { id: aud.own.s.L7.015, kind: audio, source: own, license: OWN, status: planned, text: "Siz İngiliz misiniz?" }
- { id: aud.own.s.L7.016, kind: audio, source: own, license: OWN, status: planned, text: "Evet, İngilizim." }
- { id: aud.own.s.L7.017, kind: audio, source: own, license: OWN, status: planned, text: "Ali evli mi?" }
- { id: aud.own.s.L7.018, kind: audio, source: own, license: OWN, status: planned, text: "Sen aç mısın?" }
- { id: aud.own.s.L7.019, kind: audio, source: own, license: OWN, status: planned, text: "Hayır, aç değilim." }
- { id: aud.own.s.L7.020, kind: audio, source: own, license: OWN, status: planned, text: "Nasılsınız?" }
- { id: aud.own.s.L8.001, kind: audio, source: own, license: OWN, status: planned, text: "Çay var mı?" }
- { id: aud.own.s.L8.002, kind: audio, source: own, license: OWN, status: planned, text: "Var." }
- { id: aud.own.s.L8.003, kind: audio, source: own, license: OWN, status: planned, text: "Yok." }
- { id: aud.own.s.L8.004, kind: audio, source: own, license: OWN, status: planned, text: "Kahve var mı?" }
- { id: aud.own.s.L8.006, kind: audio, source: own, license: OWN, status: planned, text: "Süt yok." }
- { id: aud.own.s.L8.007, kind: audio, source: own, license: OWN, status: planned, text: "Ekmek var mı?" }
- { id: aud.own.s.L8.008, kind: audio, source: own, license: OWN, status: planned, text: "Peynir yok." }
- { id: aud.own.s.L8.009, kind: audio, source: own, license: OWN, status: planned, text: "Zeytin var." }
- { id: aud.own.s.L8.010, kind: audio, source: own, license: OWN, status: planned, text: "Simit var mı?" }
- { id: aud.own.s.L8.011, kind: audio, source: own, license: OWN, status: planned, text: "Su var mı?" }
- { id: aud.own.s.L8.012, kind: audio, source: own, license: OWN, status: planned, text: "Çay yok, kahve var." }
- { id: aud.own.s.L8.013, kind: audio, source: own, license: OWN, status: planned, text: "Yumurta var mı?" }
- { id: aud.own.s.L8.014, kind: audio, source: own, license: OWN, status: planned, text: "Çok ekmek var." }
- { id: aud.own.s.L8.015, kind: audio, source: own, license: OWN, status: planned, text: "İki çay, lütfen." }
- { id: aud.own.s.L8.016, kind: audio, source: own, license: OWN, status: planned, text: "Kahve yok mu?" }
- { id: aud.own.s.L8.017, kind: audio, source: own, license: OWN, status: planned, text: "Bu peynir değil." }
- { id: aud.own.s.L9.001, kind: audio, source: own, license: OWN, status: planned, text: "Güzel bir ev." }
- { id: aud.own.s.L9.002, kind: audio, source: own, license: OWN, status: planned, text: "Ev büyük." }
- { id: aud.own.s.L9.003, kind: audio, source: own, license: OWN, status: planned, text: "Ev çok güzel." }
- { id: aud.own.s.L9.004, kind: audio, source: own, license: OWN, status: planned, text: "Kırmızı bir araba." }
- { id: aud.own.s.L9.005, kind: audio, source: own, license: OWN, status: planned, text: "Araba kırmızı." }
- { id: aud.own.s.L9.006, kind: audio, source: own, license: OWN, status: planned, text: "Üç kedi." }
- { id: aud.own.s.L9.007, kind: audio, source: own, license: OWN, status: planned, text: "Beş kitap var." }
- { id: aud.own.s.L9.008, kind: audio, source: own, license: OWN, status: planned, text: "Büyük bir ev." }
- { id: aud.own.s.L9.009, kind: audio, source: own, license: OWN, status: planned, text: "Telefon yeni mi?" }
- { id: aud.own.s.L9.010, kind: audio, source: own, license: OWN, status: planned, text: "Bu çok pahalı." }
- { id: aud.own.s.L9.011, kind: audio, source: own, license: OWN, status: planned, text: "Su soğuk mu?" }
- { id: aud.own.s.L9.012, kind: audio, source: own, license: OWN, status: planned, text: "On öğrenci var." }
- { id: aud.own.s.L9.013, kind: audio, source: own, license: OWN, status: planned, text: "Dört büyük ev." }
- { id: aud.own.s.L9.014, kind: audio, source: own, license: OWN, status: planned, text: "Çok güzel bir ev." }
- { id: aud.own.s.L9.015, kind: audio, source: own, license: OWN, status: planned, text: "İki sıcak çay, lütfen." }
- { id: aud.own.s.L9.016, kind: audio, source: own, license: OWN, status: planned, text: "Yedi gün." }
- { id: aud.own.s.L9.017, kind: audio, source: own, license: OWN, status: planned, text: "Ben yeni bir öğrenciyim." }
- { id: aud.own.s.L9.018, kind: audio, source: own, license: OWN, status: planned, text: "Üç kitap var." }
- { id: aud.own.s.L9.019, kind: audio, source: own, license: OWN, status: planned, text: "Sekiz kalem." }
- { id: aud.own.s.L9.020, kind: audio, source: own, license: OWN, status: planned, text: "Mavi bir çanta." }
- { id: aud.own.s.L9.021, kind: audio, source: own, license: OWN, status: planned, text: "Evet, su çok soğuk." }
- { id: aud.own.s.T1.001, kind: audio, source: own, license: OWN, status: planned, text: "Günaydın!" }
- { id: aud.own.s.T1.002, kind: audio, source: own, license: OWN, status: planned, text: "İyi geceler!" }
- { id: aud.own.s.T1.003, kind: audio, source: own, license: OWN, status: planned, text: "Teşekkür ederim." }
- { id: aud.own.s.T1.004, kind: audio, source: own, license: OWN, status: planned, text: "Rica ederim." }
- { id: aud.own.s.T1.005, kind: audio, source: own, license: OWN, status: planned, text: "Hoş geldiniz!" }
- { id: aud.own.s.T1.006, kind: audio, source: own, license: OWN, status: planned, text: "Hoş bulduk!" }
- { id: aud.own.s.T1b.001, kind: audio, source: own, license: OWN, status: planned, text: "Anlamadım." }
- { id: aud.own.s.T1b.002, kind: audio, source: own, license: OWN, status: planned, text: "Bu ne demek?" }
- { id: aud.own.s.T2.001, kind: audio, source: own, license: OWN, status: planned, text: "Taksi!" }
- { id: aud.own.s.T2.002, kind: audio, source: own, license: OWN, status: planned, text: "Bu bir müze." }
- { id: aud.own.s.T2.003, kind: audio, source: own, license: OWN, status: planned, text: "O bir film." }
- { id: aud.own.s.T4.001, kind: audio, source: own, license: OWN, status: planned, text: "Ahmet Türk." }
- { id: aud.own.s.T4.002, kind: audio, source: own, license: OWN, status: planned, text: "O Alman." }
- { id: aud.own.s.T4.003, kind: audio, source: own, license: OWN, status: planned, text: "Bu kitap Türkçe." }
- { id: aud.own.s.T4.004, kind: audio, source: own, license: OWN, status: planned, text: "Ben Kanadalıyım." }
- { id: aud.own.s.T5.001, kind: audio, source: own, license: OWN, status: planned, text: "Ali doktor." }
- { id: aud.own.s.T5.002, kind: audio, source: own, license: OWN, status: planned, text: "Ali polis değil." }
- { id: aud.own.s.T5.003, kind: audio, source: own, license: OWN, status: planned, text: "Ben emekliyim." }
- { id: aud.own.s.T6.001, kind: audio, source: own, license: OWN, status: planned, text: "Bu kahve mi?" }
- { id: aud.own.s.T6.002, kind: audio, source: own, license: OWN, status: planned, text: "Hayır, bu çay." }
- { id: aud.own.s.T6.003, kind: audio, source: own, license: OWN, status: planned, text: "Şeker var mı?" }
- { id: aud.own.s.T6.004, kind: audio, source: own, license: OWN, status: planned, text: "Bal yok." }
- { id: aud.own.s.T7.001, kind: audio, source: own, license: OWN, status: planned, text: "Çanta mavi." }
- { id: aud.own.s.T7.002, kind: audio, source: own, license: OWN, status: planned, text: "Kalem siyah mı?" }
- { id: aud.own.s.T7.003, kind: audio, source: own, license: OWN, status: planned, text: "Ev büyük mü?" }
- { id: aud.own.s.T7.004, kind: audio, source: own, license: OWN, status: planned, text: "Kahve sıcak." }
- { id: aud.own.s.T7.005, kind: audio, source: own, license: OWN, status: planned, text: "Uzun bir gün." }
- { id: aud.own.s.T7.006, kind: audio, source: own, license: OWN, status: planned, text: "Türkçe zor mu?" }
