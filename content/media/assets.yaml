- { id: aud.own.s.L13.017, kind: audio, source: own, license: OWN, status: planned, text: "Tavuk da var." }
- { id: aud.own.s.L13.018, kind: audio, source: own, license: OWN, status: planned, text: "Evde kedi var." }
- { id: aud.own.s.L13.019, kind: audio, source: own, license: OWN, status: planned, text: "Kedi bahçede." }
- { id: aud.own.s.L13.020, kind: audio, source: own, license: OWN, status: planned, text: "Bahçede köpek var mı?" }
- { id: aud.own.s.T10.001, kind: audio, source: own, license: OWN, status: planned, text: "Bahçede bir köpek var." }
- { id: aud.own.s.T10.002, kind: audio, source: own, license: OWN, status: planned, text: "Balık suda." }
- { id: aud.own.s.T9.001, kind: audio, source: own, license: OWN, status: planned, text: "Banka nerede?" }
- { id: aud.own.s.T9.002, kind: audio, source: own, license: OWN, status: planned, text: "Ali okulda." }
- { id: aud.own.s.T9.003, kind: audio, source: own, license: OWN, status: planned, text: "Kütüphanedeyim." }
- { id: aud.own.s.T9.004, kind: audio, source: own, license: OWN, status: planned, text: "Havalimanı büyük." }
- { id: img.openmoji.envelope, kind: image, file: images/openmoji/2709.svg, source: openmoji, source_url: "https://openmoji.org/library/emoji-2709/", author: OpenMoji, license: CC-BY-SA-4.0, status: planned }
- { id: aud.own.s.L12.017, kind: audio, source: own, license: OWN, status: planned, text: "Bu mektup Ali'den." }
- { id: aud.own.s.L12.018, kind: audio, source: own, license: OWN, status: planned, text: "Ahmet Paris'ten." }
- { id: aud.own.s.L13.021, kind: audio, source: own, license: OWN, status: planned, text: "Ali de." }
- { id: aud.own.s.L13.022, kind: audio, source: own, license: OWN, status: planned, text: "Ali'de." }
- { id: aud.own.s.L13.023, kind: audio, source: own, license: OWN, status: planned, text: "Bende." }

