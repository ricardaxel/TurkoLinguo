  vowel_back: "Look at the last vowel of **{word}**: **{v}** is a back vowel, so the ending has **ı** or **u**: {answer}."
  vowel_front: "Look at the last vowel of **{word}**: **{v}** is a front vowel, so the ending has **i** or **ü**: {answer}."
  vowel_round: "4-way harmony: a ı → **ı**, e i → **i**, o u → **u**, ö ü → **ü**. The last vowel of **{word}** is **{v}**: {answer}."
  last_not_first: "Only the **last** vowel counts, not the first one."
  stem_changed: "The ending starts with a consonant, so **{word}** doesn't change: **{answer}**."
  detached: "The ending is **attached** to the word: **{answer}**."
  no_apostrophe: "-lI makes a **new word**, so there's **no apostrophe**: **{answer}**."
  ci_voiceless: "**{word}** ends in **{c}**, one of the Fıstıkçı Şahap letters → **ç**: {answer}."
